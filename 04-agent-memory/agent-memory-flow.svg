<rect x="81" y="222" width="46" height="24" rx="10" fill="#DAE9FA" stroke="none" stroke-width="1" />
<text x="104" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="#3670B6" >输入</text>
<text x="147.0" y="275" font-size="19" font-weight="650" text-anchor="middle" fill="#19395D" >用户消息</text>
<text x="147.0" y="301" font-size="19" font-weight="650" text-anchor="middle" fill="#19395D" >+ thread_id</text>
<rect x="263" y="209" width="168" height="112" rx="18" fill="#F8FBFF" stroke="#C5D7EC" stroke-width="1.7" />
<rect x="278" y="222" width="46" height="24" rx="10" fill="#E8EFF9" stroke="none" stroke-width="1" />
