<path d="M 1045 265 L 1064 265" fill="none" stroke="#6386AD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<rect x="48" y="422" width="725" height="249" rx="22" fill="#F2FBF7" stroke="#C9E8D7" stroke-width="1.3" />
<rect x="70" y="447" width="8" height="22" rx="4" fill="#23A078" stroke="none" stroke-width="1" />
<text x="88" y="466" font-size="17" font-weight="700" text-anchor="start" fill="#1D805B" >MEMORY / 会话状态</text>
<text x="744" y="466" font-size="14" font-weight="400" text-anchor="end" fill="#5A9378" >同一 Saver · 不同 thread_id</text>
<rect x="266" y="504" width="433" height="114" rx="17" fill="#FFFFFF" stroke="#5DBF91" stroke-width="2" filter="url(#shadow)"/>
<rect x="284" y="527" width="48" height="47" rx="12" fill="#E1F5E9" stroke="none" stroke-width="1" />
<rect x="297" y="539" width="22" height="21" rx="4" fill="#F3FFF7" stroke="#3D9B6D" stroke-width="2" />
<ellipse cx="308" cy="539" rx="11" ry="4" fill="#DDF3E5" stroke="#3D9B6D" stroke-width="2"/>
<text x="354" y="546" font-size="23" font-weight="700" text-anchor="start" fill="#155E47" >InMemorySaver</text>
<text x="354" y="577" font-size="16" font-weight="450" text-anchor="start" fill="#42745F" >Checkpoint：按 thread_id 隔离历史状态</text>
<text x="354" y="599" font-size="14" font-weight="420" text-anchor="start" fill="#638575" >进程内存保存 · 重启后不保留</text>
<text x="85" y="534" font-size="17" font-weight="700" text-anchor="start" fill="#1D805B" >按线程读取</text>
<text x="85" y="561" font-size="15" font-weight="400" text-anchor="start" fill="#527A67" >第 2 轮可获取</text>
<text x="85" y="586" font-size="15" font-weight="400" text-anchor="start" fill="#527A67" >第 1 轮历史</text>
