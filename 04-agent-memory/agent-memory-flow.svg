<text x="865" y="598" font-size="17" font-weight="650" text-anchor="start" fill="#63478D" >agent.get_state(config)</text>
<text x="865" y="622" font-size="14" font-weight="400" text-anchor="start" fill="#857398" >按 thread_id 查看已保存的状态</text>
<path d="M 699 595 L 817 605" fill="none" stroke="#8B72BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7" marker-end="url(#arrowPurple)"/>
<rect x="50" y="700" width="1179" height="41" rx="12" fill="#EEF3F9" stroke="none" stroke-width="1" />
<text x="72" y="727" font-size="15" font-weight="450" text-anchor="start" fill="#506A86" >注：本图为简化视图；实际执行中，LangGraph 可在多个步骤产生 Checkpoint，而非只在最终回复后保存一次。</text>
</svg>