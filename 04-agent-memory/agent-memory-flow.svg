<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">Agent Memory：短期记忆执行架构</title>
<desc id="svgDesc">从用户消息与 thread_id 出发，Agent 按线程加载状态、组合历史消息与新消息、调用 Gemini 并更新 AgentState；InMemorySaver 负责保存或读取 Checkpoint，LangSmith 负责观察运行。</desc>
<defs>
<marker id="arrowBlue" viewBox="0 0 12 12" markerWidth="7" markerHeight="7" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#6386AD" stroke-width="2"/></marker>
<marker id="arrowGreen" viewBox="0 0 12 12" markerWidth="7" markerHeight="7" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#21936B" stroke-width="2"/></marker>
<marker id="arrowPurple" viewBox="0 0 12 12" markerWidth="7" markerHeight="7" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#8B72BC" stroke-width="2"/></marker>
<filter id="shadow" x="-15%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1E3A5F" flood-opacity="0.09"/></filter>
</defs>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;}</style>
<rect x="0" y="0" width="1280" height="760" rx="0" fill="#F8FAFD" stroke="none" stroke-width="1" />
<rect x="0" y="0" width="1280" height="12" rx="0" fill="#3567A5" stroke="none" stroke-width="1" />
<rect x="47" y="38" width="8" height="41" rx="4" fill="#3A73B9" stroke="none" stroke-width="1" />
<text x="75" y="70" font-size="32" font-weight="700" text-anchor="start" fill="#172C4A" >Agent Memory · 短期记忆执行架构</text>
<text x="76" y="106" font-size="17" font-weight="400" text-anchor="start" fill="#687C91" >thread_id 定位会话  ·  Checkpointer 保存 / 恢复状态  ·  LangSmith 只负责追踪</text>
<rect x="48" y="143" width="1184" height="239" rx="22" fill="#FFFFFF" stroke="#DEE8F5" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="68" y="164" width="9" height="22" rx="4" fill="#3A73B9" stroke="none" stroke-width="1" />
<text x="88" y="184" font-size="16" font-weight="700" text-anchor="start" fill="#3166A6" >AGENT / LANGGRAPH</text>
<text x="1173" y="184" font-size="15" font-weight="450" text-anchor="end" fill="#8293A7" >主执行链  ·  每次 invoke</text>
