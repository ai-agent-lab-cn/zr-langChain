<text x="759.0" y="275" font-size="19" font-weight="650" text-anchor="middle" fill="#19395D" >Gemini</text>
<text x="759.0" y="301" font-size="19" font-weight="650" text-anchor="middle" fill="#19395D" >生成回答</text>
<rect x="874" y="209" width="166" height="112" rx="18" fill="#F8FBFF" stroke="#C5D7EC" stroke-width="1.7" />
<rect x="889" y="222" width="46" height="24" rx="10" fill="#E8EFF9" stroke="none" stroke-width="1" />
<text x="912" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="#3670B6" >写回</text>
<text x="957.0" y="275" font-size="19" font-weight="650" text-anchor="middle" fill="#19395D" >更新</text>
<text x="957.0" y="301" font-size="19" font-weight="650" text-anchor="middle" fill="#19395D" >AgentState</text>
<rect x="1075" y="209" width="137" height="112" rx="18" fill="#E7F1FF" stroke="#70A2DF" stroke-width="1.7" />
<rect x="1090" y="222" width="46" height="24" rx="10" fill="#DAE9FA" stroke="none" stroke-width="1" />
<text x="1113" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="#3670B6" >输出</text>
<text x="1143.5" y="275" font-size="19" font-weight="650" text-anchor="middle" fill="#19395D" >返回</text>
<text x="1143.5" y="301" font-size="19" font-weight="650" text-anchor="middle" fill="#19395D" >Agent 回复</text>
