<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ttl dsc"><title id="ttl">LangChain MCP Agent 工具调用链路</title><desc id="dsc">用户问题交给 Gemini Agent，模型产生 Tool Call，LangChain 通过 MCPAdapter 和 stdio 子进程执行 FastMCP 工具，结果经 ToolMessage 回到模型后生成最终答案；LangSmith 负责旁路追踪。</desc><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft Yahei",Arial,sans-serif} .heading{font-size:27px;font-weight:700;fill:#203453}.body{font-size:19px;font-weight:650;fill:#21344d}.desc{font-size:14px;fill:#5c708a}.small{font-size:14px;font-weight:650;fill:#496b8a}.edge{fill:none;stroke:#7895b3;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:7 7;stroke:#9e8db8}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7895b3" /></marker><marker id="arrowleft" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#7895b3" /></marker></defs><rect width="1280" height="720" rx="24" fill="#f8fbff" /><rect x="0" y="0" width="1280" height="9" fill="#4c80c3" /><text x="56" y="56" class="heading">LangChain MCP Agent｜工具标准化集成</text><text x="57" y="86" class="desc">第 05 章 · FastMCP Server + MCPAdapter + Gemini · stdio 真实工具调用流程</text><rect x="45" y="120" width="1190" height="484" rx="23" fill="#ffffff" stroke="#dce6f1" stroke-width="2" /><text x="68" y="153" class="small">① 发现与调用工具</text><text x="68" y="381" class="small">② 结果回传与最终回答</text><g><rect x="68" y="184" width="168" height="120" rx="18" fill="#edf3fd" stroke="#85a8d4" stroke-width="2" /><text x="152.0" y="228" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#1d4478">用户问题</text><text x="152.0" y="257" text-anchor="middle" class="desc">查询模拟天气</text><text x="152.0" y="279" text-anchor="middle" class="desc">或整数计算</text></g><g><rect x="282" y="184" width="230" height="120" rx="18" fill="#edf3fd" stroke="#85a8d4" stroke-width="2" /><text x="397.0" y="228" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#1d4478">Gemini + Agent</text><text x="397.0" y="257" text-anchor="middle" class="desc">选择工具和参数</text><text x="397.0" y="279" text-anchor="middle" class="desc">create_agent</text></g><g><rect x="560" y="184" width="218" height="120" rx="18" fill="#edf3fd" stroke="#85a8d4" stroke-width="2" /><text x="669.0" y="228" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#1d4478">MCPAdapter</text><text x="669.0" y="257" text-anchor="middle" class="desc">LangChain Runtime</text><text x="669.0" y="279" text-anchor="middle" class="desc">适配与执行工具</text></g><g><rect x="821" y="166" width="365" height="160" rx="20" fill="#e9f6ed" stroke="#76b48e" stroke-width="2" /><text x="1003" y="203" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#226341">FastMCP Server</text><rect x="839" y="225" width="164" height="76" rx="13" fill="#ffffff" stroke="#8ac5a3" /><text x="921" y="254" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#226341">get_mock_weather</text><text x="921" y="278" text-anchor="middle" class="desc">模拟天气</text><rect x="1009" y="225" width="160" height="76" rx="13" fill="#ffffff" stroke="#8ac5a3" /><text x="1089" y="254" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#226341">calculate</text><text x="1089" y="278" text-anchor="middle" class="desc">加法 / 乘法</text></g><g><rect x="821" y="415" width="365" height="122" rx="18" fill="#e9f6ed" stroke="#76b48e" stroke-width="2" /><text x="1003.5" y="459" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#226341">MCP Tool Result</text><text x="1003.5" y="488" text-anchor="middle" class="desc">工具执行返回真实结果</text><text x="1003.5" y="510" text-anchor="middle" class="desc">经 stdio 发回 Client</text></g><g><rect x="560" y="415" width="218" height="122" rx="18" fill="#edf3fd" stroke="#85a8d4" stroke-width="2" /><text x="669.0" y="459" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#1d4478">ToolMessage</text><text x="669.0" y="488" text-anchor="middle" class="desc">Runtime 把工具结果</text><text x="669.0" y="510" text-anchor="middle" class="desc">加入模型上下文</text></g><g><rect x="282" y="415" width="230" height="122" rx="18" fill="#edf3fd" stroke="#85a8d4" stroke-width="2" /><text x="397.0" y="459" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#1d4478">Gemini 再次生成</text><text x="397.0" y="488" text-anchor="middle" class="desc">参考 ToolMessage</text><text x="397.0" y="510" text-anchor="middle" class="desc">组织最终回复</text></g><g><rect x="68" y="415" width="168" height="122" rx="18" fill="#e9f0fe" stroke="#7e9fd4" stroke-width="2" /><text x="152.0" y="459" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#1d4478">最终回答</text><text x="152.0" y="488" text-anchor="middle" class="desc">真实工具结果</text><text x="152.0" y="510" text-anchor="middle" class="desc">模拟天气须明确标注</text></g><line class="edge" x1="240" y1="247" x2="276" y2="247" marker-end="url(#arrow)" /><line class="edge" x1="516" y1="247" x2="554" y2="247" marker-end="url(#arrow)" /><line class="edge" x1="782" y1="247" x2="815" y2="247" marker-end="url(#arrow)" /><text x="684" y="174" text-anchor="middle" class="small">Tool Call → MCP stdio</text><line class="edge" x1="1003" y1="334" x2="1003" y2="409" marker-end="url(#arrow)" /><text x="1026" y="374" class="desc">Tool Result</text><line class="edge" x1="815" y1="477" x2="784" y2="477" marker-end="url(#arrow)" /><line class="edge" x1="554" y1="477" x2="518" y2="477" marker-end="url(#arrow)" /><line class="edge" x1="276" y1="477" x2="241" y2="477" marker-end="url(#arrow)" /><text x="674" y="400" class="desc">转换</text><text x="370" y="400" class="desc">模型读结果</text><rect x="69" y="623" width="495" height="59" rx="14" fill="#f2eefb" stroke="#aa95d1" stroke-width="1.7" /><text x="90" y="649" style="font-size:17px;font-weight:700;fill:#684b98">LangSmith Trace（旁路追踪）</text><text x="90" y="669" class="desc">模型调用 · Tool Calls · Tool Runs · Tokens</text><rect x="587" y="623" width="602" height="59" rx="14" fill="#f5f8fc" stroke="#bdcddd" stroke-width="1.7" /><text x="608" y="647" style="font-size:16px;font-weight:700;fill:#49657e">本章边界：无真实天气 API · 无外部授权 · 无数据库</text><text x="608" y="668" class="desc">MCP Server 在独立 stdio 子进程中；模型不直接执行 Server 代码</text></svg>